{% extends "master.html" %}

{% block title %}
  My Tennis Club - List of all members
{% endblock %}


{% block content %}

  <p><a href="/">HOME</a></p>

  <h1>Members</h1>
  
  <ul>
    {% for x in mymembers %}
      <li><a href="details/{{ x.id }}">{{ x.firstname }} {{ x.lastname }}</a></li>
    {% endfor %}
  </ul>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTXj_SeBRLAzkA0geegV2IuJ6PduuqcfwOmLBJNyd2oEQ&s=10" width="200"></img>

{% endblock %}
